name: Build and Submit iOS to TestFlight

# Manual only — run from GitHub Actions when you actually want a new TestFlight build.
# Requires EXPO_TOKEN in repo secrets.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Release operation"
        required: true
        default: "build-and-submit"
        type: choice
        options:
          - build-and-submit
          - build
          - submit
          - inspect
      build_id:
        description: "Existing EAS build ID for submit or inspect"
        required: false
        default: ""
        type: string

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build and submit production iOS app
        if: ${{ inputs.operation == 'build-and-submit' || inputs.operation == 'build' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required for automated EAS builds." >&2
            exit 1
          fi
          if [ "$RELEASE_OPERATION" = "build" ]; then
            eas build --platform ios --profile production --non-interactive
          else
            eas build --platform ios --profile production --auto-submit --non-interactive
          fi

      - name: Submit existing production iOS build
        if: ${{ inputs.operation == 'submit' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_SUBMIT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          test -n "$EAS_SUBMIT_BUILD_ID"
          eas submit --platform ios --profile production --id "$EAS_SUBMIT_BUILD_ID" --non-interactive --wait

      - name: Inspect existing EAS build
        if: ${{ inputs.operation == 'inspect' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_INSPECT_BUILD_ID: ${{ inputs.build_id }}
        run: |
          test -n "$EAS_INSPECT_BUILD_ID"
          eas build:view "$EAS_INSPECT_BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const build = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/eas-build.json`, 'utf8'));
          console.log(`Build ${build.id}: ${build.status}`);
          console.log(JSON.stringify({ error: build.error, buildNumber: build.appBuildVersion }));
          const relevant = [];
          const clean = value => String(value)
            .replace(/\u001b\[[0-9;]*m/g, '')
            .replace(/https?:\/\/[^\s"'<>]+/g, url => url.split('?')[0])
            .replaceAll(process.env.EXPO_TOKEN || '\u0000', '[REDACTED]');
          for (const entry of build.logFiles || []) {
            const response = await fetch(typeof entry === 'string' ? entry : entry.url);
            if (!response.ok) throw new Error(`Build log download returned HTTP ${response.status}`);
            const log = await response.text();
            for (const raw of log.split('\n')) {
              let event;
              try { event = JSON.parse(raw); } catch { event = { msg: raw }; }
              const message = event.msg ?? event.message ?? raw;
              if (/INSTALL_DEPENDENCIES/i.test(event.phase || '') ||
                  /npm (?:error|ERR!)|ERESOLVE|EUSAGE|EBADENGINE|lock ?file|error:|error |requires|expected|could not resolve|npm ci|yarn install/i.test(message)) {
                relevant.push(clean(message));
              }
            }
          }
          console.log(relevant.slice(-100).join('\n'));
          NODE
