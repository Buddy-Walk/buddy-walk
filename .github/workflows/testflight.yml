name: Build and Submit iOS to TestFlight

# A push to main that changes the native app starts an EAS production build
# and submits it to TestFlight. API-only and test-only changes do not.
# Requires EXPO_TOKEN in repo secrets.
on:
  push:
    branches: [main]
    paths:
      - "mobile/App.tsx"
      - "mobile/app.json"
      - "mobile/app.config.js"
      - "mobile/eas.json"
      - "mobile/index.js"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "mobile/assets/**"
      - "mobile/src/**"
      - "!mobile/src/test/**"
      - "mobile/buddy-walk-default-api.json"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build and submit production iOS app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required for automated EAS builds." >&2
            exit 1
          fi
          eas build --platform ios --profile production --auto-submit --non-interactive
