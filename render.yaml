# Render Blueprint — Buddy Walk API (zero-config).
#
# Deploy: https://dashboard.render.com → New → Blueprint → select this repo.
# Public URL: https://buddy-walk-api.onrender.com
#
# OpenAI and Google Maps keys are read from the service environment.
# Render auto-generates ADMIN_TOKEN.
# After deploy, open:
#   https://buddy-walk-api.onrender.com/usage?token=YOUR_ADMIN_TOKEN
#
# Each capability is decided independently on its own credentials: AI needs
# OPENAI_API_KEY, speech needs AZURE_SUBSCRIPTION_KEY plus AZURE_REGION, and
# MTA needs MTA_API_KEY. Anything without its keys is proxied
# to buddywalk.app, so adding one key never disables an unrelated service.
# /api/health reports the live routing for each.
#
# buddywalk.app is retired as the AI upstream: its /api/text returns 500, so
# Q&A and Last Meters always run here when the AI keys are set, even with
# ZERO_CONFIG=true. It is still used for speech and MTA when their keys are
# missing.
#
# Telemetry, feedback, chat logs, thumbs, and companion data stay on YOUR server.
services:
  - type: web
    name: buddy-walk-api
    runtime: docker
    plan: free
    rootDir: mobile
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: ALLOWED_ORIGINS
        value: https://buddy-walk-api.onrender.com,https://justraymond99.github.io
      - key: ADMIN_TOKEN
        generateValue: true
      - key: UPSTREAM_API_ROOT
        value: https://buddywalk.app
      # Secrets are declared here but never stored in the repo. sync: false
      # means Render keeps the value in the dashboard only. Set both Azure
      # values or neither — speech falls back to the proxy unless both exist.
      - key: AZURE_SUBSCRIPTION_KEY
        sync: false
      - key: AZURE_REGION
        sync: false
      # Required for Q&A, since the buddywalk.app upstream is down.
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
